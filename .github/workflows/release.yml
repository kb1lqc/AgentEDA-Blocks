name: release
# Manual block release from main: full gate, then `pcb publish --check`, then exactly the block tags it prints
# (blocks/<Block>/vX.Y.Z, annotated, as printed). The root package wave is never tagged here (issue #9).
# Dry run by default: the plan appears in the run summary and nothing is pushed.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Only show the release plan"
        type: boolean
        default: true
permissions:
  contents: write
concurrency:
  group: release
  cancel-in-progress: false
env:
  PCB_VERSION: v0.4.102
  KICAD_IMAGE_TAG: 10.0.8
jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      KICAD_CLI: ${{ github.workspace }}/circuit-blocks/.github/scripts/kicad-cli
      CHROME: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@v4
        with:
          path: circuit-blocks
          fetch-depth: 0
          fetch-tags: true
      - id: zl
        run: echo "ref=$(sed -n 's/^ZL_VERSION = "\(.*\)"/\1/p' circuit-blocks/analysis/_zl.py)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: kb1lqc/zener-library
          ref: ${{ steps.zl.outputs.ref }}
          path: zener-library
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tools
        run: |
          pip install --quiet matplotlib
          sudo apt-get install -y --no-install-recommends poppler-utils zsh > /dev/null
          docker pull -q "kicad/kicad:$KICAD_IMAGE_TAG" > /dev/null
          circuit-blocks/.github/scripts/install-pcb.sh
      - name: Gate (tools/verify.py)
        working-directory: circuit-blocks
        run: python3 tools/verify.py --log-dir "$RUNNER_TEMP/verify-logs"
      - name: Plan (pcb publish --check)
        working-directory: circuit-blocks
        run: pcb publish --check > "$RUNNER_TEMP/plan.json"
      - name: Tag
        working-directory: circuit-blocks
        env:
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          args=("$RUNNER_TEMP/plan.json")
          [ "$DRY_RUN" = "false" ] && args+=(--push)
          python3 .github/scripts/release.py "${args[@]}" | tee -a "$GITHUB_STEP_SUMMARY"
